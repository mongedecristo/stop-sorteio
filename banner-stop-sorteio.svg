<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Sorteia Letra para STOP</title>
  <desc id="descricao">Uma ilustração neon com letras, um contador e a chamada para jogar STOP.</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10172d"/>
      <stop offset="0.55" stop-color="#26366a"/>
      <stop offset="1" stop-color="#492a78"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#70f4df"/>
      <stop offset="1" stop-color="#79a8ff"/>
    </linearGradient>
    <filter id="luz" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="34" fill="url(#fundo)"/>
  <circle cx="1040" cy="50" r="155" fill="#70f4df" opacity="0.08"/>
  <circle cx="115" cy="340" r="185" fill="#ffcf70" opacity="0.08"/>
  <path d="M0 278C220 218 340 350 555 290s360-130 645-45v115H0z" fill="#080c18" opacity="0.3"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="74" y="106" fill="#ffcf70" font-size="24" font-weight="700" letter-spacing="7">JOGO DE STOP</text>
    <text x="70" y="196" fill="#f4f7ff" font-size="76" font-weight="900" letter-spacing="2">SORTEIA</text>
    <text x="74" y="263" fill="url(#brilho)" font-size="58" font-weight="900" letter-spacing="8" filter="url(#luz)">LETRA!</text>
    <text x="78" y="316" fill="#c6d6ff" font-size="20" letter-spacing="1">Prepare-se. A próxima letra está chegando.</text>

    <g transform="translate(790 54)">
      <rect x="0" y="0" width="320" height="240" rx="26" fill="#0b1124" stroke="#70f4df" stroke-opacity="0.6" stroke-width="2"/>
      <text x="28" y="48" fill="#b7c8f5" font-size="16" font-weight="700" letter-spacing="4">PRÓXIMA LETRA EM</text>
      <text x="35" y="166" fill="#72f6e5" font-size="116" font-weight="900" filter="url(#luz)">05</text>
      <circle cx="252" cy="128" r="47" fill="#ffcf70"/>
      <text x="252" y="150" fill="#10172d" font-size="62" font-weight="900" text-anchor="middle">A</text>
      <text x="160" y="211" fill="#c6d6ff" font-size="12" letter-spacing="1" text-anchor="middle" textLength="272" lengthAdjust="spacingAndGlyphs">60 SEGUNDOS · UMA LETRA POR VEZ</text>
    </g>
  </g>
</svg>
